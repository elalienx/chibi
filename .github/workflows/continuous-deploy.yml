name: Continuous Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Firebase hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12
          runtime: node@lts
          cache: true

      - name: Astro build
        run: pnpm build

      - name: Storybook build
        run: pnpm build-storybook

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APHRODITE_CHIBI }}
          projectId: aphrodite-chibi
          channelId: live
