name: Update CI screenshots

# Run it manually from the Actions tab ("Run workflow") on the branch that needs new screenshots.
# Then download the "ci-screenshots" artifact from the run page and unzip it into snapshots/ci/.
on:
  workflow_dispatch:

jobs:
  update-screenshots:
    name: Update CI screenshots
    runs-on: avrea-ubuntu-latest-8-vcpu-16gb # Must match continuous-integration.yml so the screenshots are pixel identical.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12
          runtime: node@lts
          cache: true

      - name: Install Chromium
        run: pnpm exec playwright install chromium --only-shell

      - name: Take new screenshots
        run: pnpm playwright --update-snapshots=all

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-screenshots
          path: snapshots/ci/
          if-no-files-found: error
